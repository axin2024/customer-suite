ServerTokens Prod

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /srv/crm/public
    ServerSignature Off
    <Directory /srv/crm/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        RewriteEngine On
        RewriteRule ^subscriptions/[1-9][0-9]*/usage-events$ api.php [END]
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
